[package]
name = "tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Mirrors the root crate's clap — already in Cargo.lock, so no new toolchain
# install. xshell is the only net-new crate; cargo compiles it as a library,
# nobody installs it.
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
# Reused for cargo-style status/error output (util::output), so tasks render the
# same way as the `ahm` binary and the sibling tools.
agent-habilis-mock = { path = ".." }

[lints]
workspace = true
