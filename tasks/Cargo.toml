[package]
name = "tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Mirrors the root crate's clap — already in Cargo.lock, so no new toolchain
# install. xshell is the only net-new crate; cargo compiles it as a library,
# nobody installs it.
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
# Reused for cargo-style status/error output (util::output), so tasks render the
# same way as the `agent-mock` binary and the sibling tools. Also exposes
# `cli_command()`, which the `man` task feeds to clap_mangen.
agent-habilis-mock = { path = ".." }
# Man-page generation lives in the dev-only `man` task; renders the lib's clap
# command tree to roff. Never compiled into the shipped `agent-mock`.
clap_mangen = "0.2"

[lints]
workspace = true
