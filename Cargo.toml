[workspace]
members = ["tasks"]

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep on
# toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.95"

# Mirrors the sibling `swarm` crate's lint posture: edition idioms on, zero
# unsafe, ASCII-only identifiers, and clippy pedantic as a warning floor. See
# `clippy.toml` for the readability knobs. Both crates opt in with
# `[lints] workspace = true`.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `forbid`, not `deny`: this workspace carries no FFI and never needs `unsafe`.
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening).
non_ascii_idents = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Documented opt-outs (noise, not readability wins):
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
implicit_hasher = "allow"
ignored_unit_patterns = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "agent-habilis-mock"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "HTTP mock server for development and stable E2E tests"
documentation = "https://github.com/agent-habilis/mock"
license = "MIT"
repository = "https://github.com/agent-habilis/mock"
homepage = "https://github.com/agent-habilis/mock"
readme = "README.md"
keywords = ["http", "mock", "proxy", "testing", "fixtures"]
categories = ["development-tools::testing", "web-programming::http-server"]
# Saved property-test failure seeds are committed (so they re-run) but should
# not ship in the published package.
exclude = ["proptest-regressions/"]

[lints]
workspace = true

[lib]
# Kept short and stable: the in-process library facade (and every
# `tests/*.rs` integration crate) imports it as `agent_habilis_mock`.
name = "agent_habilis_mock"
path = "src/lib.rs"

[[bin]]
# `ahm` = agent-habilis-mock, mirroring the sibling `ahs` (swarm) binary.
name = "ahm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["net", "time", "signal", "rt-multi-thread", "macros", "fs", "io-util"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["http1", "client-legacy", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tower-service = "0.3"
futures-util = "0.3"
sha2 = "0.10"
flate2 = "1"
brotli = "7"
base64 = "0.22"
thiserror = "2"
# cargo-style status output (anstyle = the styling crate cargo/clap use;
# anstream auto-strips color when the stream isn't a terminal). Both already
# in Cargo.lock via clap, so no new download.
anstyle = "1"
anstream = "0.6"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
